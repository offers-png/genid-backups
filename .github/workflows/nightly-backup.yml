name: Nightly backup

# 09:00 UTC daily. Also runnable on demand (Actions tab -> this workflow ->
# "Run workflow") to test the pipeline without waiting for the schedule.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pg_dump (PostgreSQL client)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm install

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/backup.mjs

      - name: Commit and push
        run: |
          git config user.name "genid-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A backups/
          if git diff --cached --quiet; then
            echo "Nothing to commit (no new or pruned backups)."
            exit 0
          fi
          git commit -m "Nightly backup $(date -u +%Y-%m-%d)"
          git push
